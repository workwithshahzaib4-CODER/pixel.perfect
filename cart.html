<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart - Pixel Perfect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="cart">
    <header class="site-header">
      <div class="container nav-shell">
        <button class="menu-button" aria-label="Open menu">Menu</button>
        <a class="brand" href="index.html" aria-label="Pixel Perfect home">
          <span class="brand-wordmark">PIXEL PERFECT</span>
        </a>
        <div class="header-actions">
          <a href="index.html" class="header-link">Home</a>
          <a href="cart.html" class="cart-link">Cart <span id="cartCount" class="cart-count">0</span></a>
        </div>
      </div>
    </header>

    <div class="mobile-menu" id="mobileMenu">
      <div class="mobile-menu-panel">
        <button class="close-menu" aria-label="Close menu">Close</button>
        <nav class="mobile-nav">
          <a href="index.html">Home</a>
          <a href="category.html?category=Best%20Wall%20Setup%20Packs">Best Wall Setup Packs</a>
          <a href="category.html?category=Concept%20Cars">Concept Cars</a>

          <a href="category.html?category=Motivational">Motivational</a>
          <a href="cart.html">Cart</a>
        </nav>
      </div>
    </div>

    <main class="page-shell">
      <section class="container cart-layout">
        <div class="cart-main-panel">
          <div id="cartItems" class="cart-items"></div>
          <div id="cartExtras" class="cart-extras"></div>
          <div id="cartAddons" class="cart-addons">
            <div id="shippingOptionsPanel"></div>
            <div id="giftOptionsPanel"></div>
            <div id="paymentMethodsPanel"></div>
            <div id="discountShowcasePanel"></div>
            <div id="cartReviewsPanel"></div>
          </div>
        </div>
        <aside id="cartSummary" class="cart-summary"></aside>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <p>Pixel Perfect</p>
        <p>Custom posters • wall setup packs • premium prints</p>
      </div>
    </footer>

    <script src="script.js"></script>
    <script src="cart-addons.js"></script>
    <script src="enhanced-cart.js"></script>

</html>
